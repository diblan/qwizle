services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qwizle
      POSTGRES_USER: qwizle
      POSTGRES_PASSWORD: qwizle
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwizle -d qwizle"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qwizle
      SPRING_DATASOURCE_USERNAME: qwizle
      SPRING_DATASOURCE_PASSWORD: qwizle
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      QWIZLE_CORS_ALLOWED_ORIGIN_PATTERNS: http://localhost:4200
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  app:
    build: ./app
    environment:
      QWIZLE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - api
    ports:
      - "4200:4200"

volumes:
  postgres-data:
