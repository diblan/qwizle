spring:
  application:
    name: qwizle-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/qwizle;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

qwizle:
  cors:
    allowed-origins: ${QWIZLE_CORS_ALLOWED_ORIGINS:http://localhost:4200}
  demo-user:
    email: ${QWIZLE_DEMO_EMAIL:learner@qwizle.test}
    password: ${QWIZLE_DEMO_PASSWORD:qwizle123}
    display-name: ${QWIZLE_DEMO_DISPLAY_NAME:Demo Learner}
